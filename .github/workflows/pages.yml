name: Deploy ledger to Pages

on:
  push:
    branches: [main]
    paths: ["ledger/**", "out/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload in one job and deploy in the next: when both run in one job, deploy-pages often finds no
  # artifact yet (actions/deploy-pages, "Intermittent No artifacts named github-pages", Oct-Nov 2026).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ledger/index.html is a fragment: claude.ai adds the document skeleton
      # when it publishes. Add one here too, so the source stays as it is.
      - name: Build site
        run: |
          mkdir -p site/data
          {
            printf '<!doctype html>\n<html lang="en">\n<meta charset="utf-8">\n'
            printf '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
            cat ledger/index.html
          } > site/index.html
          cp out/daily.json out/tasks.json out/prices.json out/waveform.json out/meta.json out/insights.json site/data/
          touch site/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
