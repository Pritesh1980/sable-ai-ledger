name: Deploy ledger to Pages

on:
  push:
    branches: [main]
    paths: ["ledger/**", "out/**", "pwa/**", "build-site.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload in one job and deploy in the next: when both run in one job, deploy-pages often finds no
  # artifact yet (actions/deploy-pages, "Intermittent No artifacts named github-pages", Oct-Nov 2026).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Wraps the ledger/index.html fragment in a document, copies the data and adds the home-screen app files.
      - name: Build site
        run: sh build-site.sh

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
